[package]
name = "onnx-http"
version = "0.1.0"
edition = "2021"
authors = ["Wictor Wilén"]
license = "MIT"
description = "ONNX embedding server with NPU acceleration"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { git = "https://github.com/pykeio/ort.git", branch = "main", features = ["load-dynamic"] }
tokenizers = "0.20"
ndarray = "0.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

